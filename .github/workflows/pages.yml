name: Publicar Atlas Bíblico (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Validar dados locais
        run: python -m unittest discover -s tests -p 'test_dados.py' -v
      - name: Preparar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar site
        id: deploy
        uses: actions/deploy-pages@v4
